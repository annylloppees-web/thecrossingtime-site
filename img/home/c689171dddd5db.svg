<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1422"/>
      <stop offset="1" stop-color="#0E1A2B"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4b774"/>
      <stop offset="1" stop-color="#C6A15B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg1)"/>
  
  <!-- Bandes tricolores discretas en bas -->
  <rect x="0" y="540" width="400" height="60" fill="#0055A4" opacity=".4"/>
  <rect x="400" y="540" width="400" height="60" fill="#F4F2ED" opacity=".15"/>
  <rect x="800" y="540" width="400" height="60" fill="#EF4135" opacity=".4"/>
  
  <!-- Architecture stylisée: silhouette d'un bâtiment officiel -->
  <g transform="translate(600,380)" opacity=".25">
    <!-- Colonnes -->
    <rect x="-200" y="0" width="20" height="160" fill="#C6A15B"/>
    <rect x="-150" y="0" width="20" height="160" fill="#C6A15B"/>
    <rect x="-100" y="0" width="20" height="160" fill="#C6A15B"/>
    <rect x="-50" y="0" width="20" height="160" fill="#C6A15B"/>
    <rect x="0" y="0" width="20" height="160" fill="#C6A15B"/>
    <rect x="50" y="0" width="20" height="160" fill="#C6A15B"/>
    <rect x="100" y="0" width="20" height="160" fill="#C6A15B"/>
    <rect x="150" y="0" width="20" height="160" fill="#C6A15B"/>
    <!-- Fronton -->
    <polygon points="-220,0 200,0 -10,-80" fill="#C6A15B"/>
    <!-- Base -->
    <rect x="-230" y="155" width="450" height="15" fill="#C6A15B"/>
  </g>
  
  <!-- Étoile/symbole central -->
  <g transform="translate(600,200)">
    <circle r="60" fill="none" stroke="#C6A15B" stroke-width="1.5" opacity=".6"/>
    <circle r="80" fill="none" stroke="#C6A15B" stroke-width=".5" opacity=".3"/>
    <text y="20" text-anchor="middle" font-family="Georgia,serif" font-size="80" fill="#C6A15B">RF</text>
  </g>
  
  <!-- Grain/texture -->
  <rect width="1200" height="600" fill="url(#bg1)" opacity="0"/>
</svg>