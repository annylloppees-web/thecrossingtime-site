<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1422"/>
      <stop offset="1" stop-color="#0E1A2B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg7)"/>
  
  <!-- 4 étapes alignées -->
  <g transform="translate(200,250)">
    <!-- Step 1 -->
    <circle r="35" fill="#C6A15B" opacity=".25"/>
    <circle r="35" fill="none" stroke="#C6A15B" stroke-width="2"/>
    <text y="10" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#C6A15B">1</text>
    <text y="80" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F4F2ED" letter-spacing="2">CHOISIR</text>
    <text y="95" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#F4F2ED" opacity=".7">la mention</text>
    
    <!-- Connector line -->
    <line x1="40" y1="0" x2="225" y2="0" stroke="#C6A15B" stroke-width="1" opacity=".4" stroke-dasharray="4 4"/>
  </g>
  
  <g transform="translate(465,250)">
    <circle r="35" fill="#C6A15B" opacity=".25"/>
    <circle r="35" fill="none" stroke="#C6A15B" stroke-width="2"/>
    <text y="10" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#C6A15B">2</text>
    <text y="80" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F4F2ED" letter-spacing="2">N° AGDREF</text>
    <text y="95" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#F4F2ED" opacity=".7">obligatoire</text>
    
    <line x1="40" y1="0" x2="225" y2="0" stroke="#C6A15B" stroke-width="1" opacity=".4" stroke-dasharray="4 4"/>
  </g>
  
  <g transform="translate(730,250)">
    <circle r="35" fill="#C6A15B" opacity=".25"/>
    <circle r="35" fill="none" stroke="#C6A15B" stroke-width="2"/>
    <text y="10" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#C6A15B">3</text>
    <text y="80" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F4F2ED" letter-spacing="2">CENTRE</text>
    <text y="95" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#F4F2ED" opacity=".7">agréé</text>
    
    <line x1="40" y1="0" x2="225" y2="0" stroke="#C6A15B" stroke-width="1" opacity=".4" stroke-dasharray="4 4"/>
  </g>
  
  <g transform="translate(995,250)">
    <circle r="35" fill="#C6A15B"/>
    <text y="10" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#0E1A2B">4</text>
    <text y="80" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#C6A15B" letter-spacing="2">EXAMEN</text>
    <text y="95" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#F4F2ED" opacity=".7">jour J</text>
  </g>
</svg>