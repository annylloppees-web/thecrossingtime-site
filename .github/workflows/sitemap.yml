name: Gerar sitemap

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'sitemap.xml'

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar sitemap.xml
        run: node scripts/gen-sitemap.mjs

      - name: Commit do sitemap (se mudou)
        run: |
          if [ -n "$(git status --porcelain sitemap.xml)" ]; then
            git config user.name  "sitemap-bot"
            git config user.email "actions@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore: atualizar sitemap.xml [skip ci]"
            git push
          else
            echo "sitemap.xml sem alteracoes."
          fi
