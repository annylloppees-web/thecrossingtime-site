name: Corrigir materia do Bruno e sitemap (uma vez)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/faxina2*.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Renomear a materia e regenerar o sitemap
        run: |
          if [ -f "materias/m_bruno_travessia_luto (1).html" ]; then
            git mv "materias/m_bruno_travessia_luto (1).html" "materias/m_bruno_travessia_luto.html"
            echo "Renomeada."
          else
            echo "Arquivo (1) nao encontrado; nada a renomear."
          fi
          node scripts/gen-sitemap.mjs
          git add sitemap.xml
          git rm -q --ignore-unmatch ".github/workflows/faxina2.yml" ".github/workflows/faxina2 (1).yml" ".github/workflows/faxina2 (2).yml"
          git config user.name  "limpeza-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: renomear materia m_bruno_travessia_luto (remover sufixo (1)) e regenerar sitemap" -m "Corrige o loop de redirecionamento (P1-1) e a entrada malformada do sitemap (P2-5) da auditoria de 22/9. A homenagem passa a abrir tambem pela URL direta." -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01XKAg97TWMy69UVbqhqefjk"
          git push
