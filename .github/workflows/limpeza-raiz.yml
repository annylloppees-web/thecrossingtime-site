name: Limpeza da raiz (uma vez)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/limpeza-raiz.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
