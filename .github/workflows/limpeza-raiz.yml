          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ -f "$f" ] && [ -f "materias/$f" ] && cmp -s "$f" "materias/$f"; then
              git rm -q "$f"
              apagadas=$((apagadas+1))
            else
              echo "PULADA (nao identica ou ausente): $f"
            fi
          done < /tmp/lista.txt
          echo "Apagadas: $apagadas"
          # o workflow se remove depois de cumprir a tarefa
          git rm -q .github/workflows/limpeza-raiz.yml
          git config user.name  "limpeza-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: remover copias duplicadas de materias na raiz ($apagadas arquivos)

As copias eram identicas (byte a byte) aos arquivos em materias/.
